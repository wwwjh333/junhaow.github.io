<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{% if page.title and page.title != '' %}{{ page.title }} · {% endif %}{{ site.name }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}?v=20260821-2">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}#home" aria-label="Junhao Wu, home">Junhao Wu</a>
        <nav aria-label="Primary navigation">
          <a data-section="home"{% if page.permalink == '/' %} class="active" aria-current="location"{% endif %} href="{{ '/' | relative_url }}#home">Home</a>
          <a data-section="publications"{% if page.permalink == '/publications/' %} class="active" aria-current="page"{% endif %} href="{{ '/' | relative_url }}#publications">Publications</a>
          <a data-section="experience"{% if page.permalink == '/experience/' %} class="active" aria-current="page"{% endif %} href="{{ '/' | relative_url }}#experience">Experience</a>
        </nav>
      </div>
    </header>

    <main id="content" class="page-shell">
      {{ content }}
    </main>

    <footer>
      <div>© {{ 'now' | date: '%Y' }} Junhao Wu</div>
      <div>Built with curiosity and care.</div>
    </footer>
    <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
  </body>
</html>
